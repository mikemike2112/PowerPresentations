# Release automatica: a ogni tag v* compila l'app per Windows x64 (eseguibile
# unico con .NET incluso) e la allega alla GitHub Release come PowerPresentations-win-x64.zip.
# Il nome del file resta sempre lo stesso: il link
#   https://github.com/mikemike2112/PowerPresentations/releases/latest/download/PowerPresentations-win-x64.zip
# porta quindi sempre all'ultima versione.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    # Solo i test che non richiedono Office installato ne' una sessione grafica:
    # quelli completi si eseguono in locale prima di creare il tag.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/PowerPresentations.Tests -c Release --filter "Category!=OfficeCom&Category!=Ui&Category!=UI&Category!=UiAutomation&Category!=Load"

  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/PowerPresentations.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out/PowerPresentations
      - name: Zip
        shell: pwsh
        run: |
          if (-not (Test-Path out/PowerPresentations/PowerPresentations.App.exe)) { throw "manca PowerPresentations.App.exe" }
          Compress-Archive -Path out/PowerPresentations -DestinationPath PowerPresentations-win-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "PowerPresentations-win-x64.zip" --title "PowerPresentations ${{ github.ref_name }}" --notes "Progetto nelle fasi iniziali: incompleto e con possibili bug. Estrai lo zip e apri PowerPresentations.App.exe. Se Windows mostra 'Windows ha protetto il PC', clicca Ulteriori informazioni e poi Esegui comunque."